[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "serviceradar-vantage"
version = "0.1.0"
description = "Apache-2.0 Python SDK for ServiceRadar Vantage external computer-vision workers"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["numpy>=1.26"]

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "serviceradar_vantage._serviceradar_vantage"
