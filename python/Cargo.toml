[package]
name = "serviceradar-vantage-py"
version = "0.1.0"
description = "Apache-2.0 PyO3 Python bindings for ServiceRadar Vantage external workers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_serviceradar_vantage"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
ndarray = "0.17.2"
numpy = "0.30.0"
parking_lot = { workspace = true }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
serde_json = { workspace = true }
serviceradar-vantage-sdk = { path = "../crates/serviceradar-vantage-sdk" }
tokio = { workspace = true }
uuid = { workspace = true }
